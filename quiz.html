<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado | Plano de Estudo</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .quiz-container {
            max-width: 800px;
            margin: 3rem auto;
            min-height: 60vh;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: var(--surface-border);
            border-radius: var(--radius-full);
            margin: 1.5rem 0 3rem;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width var(--transition-normal);
        }

        .bloco-badge {
            display: inline-block;
            background: rgba(139, 92, 246, 0.15);
            color: var(--primary-hover);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .question-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .question-text {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            color: var(--text-main);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .option-btn {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            padding: 1.2rem 1.5rem;
            text-align: left;
            font-size: 1.05rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all var(--transition-fast);
            line-height: 1.5;
        }

        .option-btn:hover {
            background: var(--surface-hover);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(4px);
        }

        .quiz-footer {
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid var(--surface-border);
            padding-top: 1.5rem;
        }

        /* Results Specific */
        .score-card {
            padding: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(var(--primary) 0%, var(--secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 2rem 0;
            position: relative;
        }
        
        .score-circle::after {
            content: '';
            position: absolute;
            width: 130px;
            height: 130px;
            background: var(--bg-color);
            border-radius: 50%;
        }

        .score-number {
            position: relative;
            z-index: 10;
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
        }

        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i data-lucide="book-open-check"></i>
                Estuda<span class="text-gradient">Mais</span>
            </a>
            
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="trilha.html">Trilha de Estudos</a></li>
                <li><a href="quiz.html" class="active">Simulados</a></li>
            </ul>

            <button class="mobile-menu-btn">
                <i data-lucide="menu"></i>
            </button>
        </div>
    </nav>

    <main class="container quiz-container animate-fade-in">
        
        <!-- App Container -->
        <div id="quiz-app" class="glass-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <span style="font-weight: 600;">Simulado: Concurso Nova Xavantina</span>
                <span id="progress-text" style="color: var(--text-muted); font-size: 0.9rem;">Questão 1 de 15</span>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>

            <div id="question-container">
                <!-- Question content will be injected here via JS -->
            </div>

            <div class="quiz-footer" style="gap: 1rem;">
                <button id="submit-btn" class="btn btn-secondary" disabled>
                    Responder
                </button>
                <button id="next-btn" class="btn btn-primary" style="display: none;">
                    Próxima Questão
                    <i data-lucide="arrow-right" size="18"></i>
                </button>
            </div>
        </div>

        <!-- Results Container -->
        <div id="results-container" style="display: none;">
            <!-- Results content will be injected here via JS -->
        </div>

    </main>

    <script src="app.js"></script>
    <script src="quiz_data.js"></script>
    <script src="quiz.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
